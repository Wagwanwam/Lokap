[versions]
agp = "9.3.3"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
navigation = "2.10.2"
# Kotlin 2.2.10: serialization 1.10+ và Coil 3.4+ được build bằng Kotlin 2.3/2.4 → giữ bản cuối build bằng Kotlin 2.2
kotlinxSerialization = "1.9.0"
camerax = "1.6.2"
# Khớp kotlinx-coroutines-core mà lifecycle/compose đang kéo về
coroutines = "1.10.2"
coil = "3.3.0"
# KSP 2.3.1+ mới hỗ trợ AGP 9 built-in Kotlin (2.3.10 sửa lỗi R-class)
ksp = "2.3.13"
# Hilt 2.59+ hỗ trợ AGP 9; 2.60 build bằng Kotlin 2.3.21 nên giữ 2.59.x
hilt = "2.59.2"
# androidx.hilt 1.4.0 (navigation-compose, work) đi kèm Hilt 2.59
androidxHilt = "1.4.0"
room = "2.8.5"
work = "2.12.0"
# Giữ tương thích Kotlin 2.2.10; BoM 35.x kéo Firebase Auth/Analytics có metadata Kotlin 2.4.
firebaseBom = "34.12.0"
# Plugin đọc app/google-services.json → resource cho Firebase SDK (bản Firebase Console đang hướng dẫn)
googleServices = "4.5.0"
# Đăng nhập Google qua Credential Manager (GoogleSignInClient cũ đã deprecated).
# firebase-auth 24.0.1 kéo sẵn credentials 1.2.0-rc01 + googleid 1.1.0 → ghi rõ để nâng lên bản stable.
# Kotlin metadata (javap, không tin POM): credentials 1.6.0 = 2.1, googleid 1.2.0 = 2.1 → Kotlin 2.2.10 đọc được.
# googleid 1.2.1 = 2.4 (POM vẫn ghi stdlib 1.8) → lỗi "incompatible version of Kotlin", giữ 1.2.0.
credentials = "1.6.0"
googleid = "1.2.0"
# Task.await() cho Firebase/Fused Location; giữ cùng bản coroutines
coroutinesPlayServices = "1.10.2"
playServicesLocation = "21.4.0"
# Chỉ lấy module core (upload); bản đầy đủ kéo thêm UI/preprocess/download không cần
cloudinary = "3.1.3"
# VietMap SDK (fork MapLibre) phát hành qua JitPack; 4.1.1 là tag mới nhất (16/09/2025)
vietmapSdk = "4.1.1"
vietmapGeojson = "1.0.0"
vietmapTurf = "1.0.2"
# Coil 3.3.0 đã kéo OkHttp 4.12.0; ghi rõ vì VietMap SDK và VietMapApi dùng trực tiếp
okhttp = "4.12.0"
gson = "2.11.0"
# Mã QR kết bạn: tạo + đọc QR, Java thuần (không cần Google Play services)
zxing = "3.5.4"

